<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldX AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .credits-badge {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .main-content {
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي مع عداد النقاط -->
  <div class="header">
    <h2>WorldX AI 🚀</h2>
    <div class="credits-badge">
      ⚡ الرصيد: <span id="user-credits-display">100</span> نقطة
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-content">
    <h1>مرحباً بك في منصة WorldX AI الذكية</h1>
    <p>منصتك المتكاملة لتوليد الصور والفيديوهات وكتابة النصوص بالدارجة المغربية.</p>
  </div>

  <!-- نظام الكريديتس والتحكم بالنقاط (100 نقطة يومياً) -->
  <script>
    const DAILY_CREDITS = 100;
    const VIDEO_COST = 6;

    // دالة جلب النقاط اليومية أو تجديدها تلقائياً
    function getDailyCredits() {
      const today = new Date().toDateString();
      const savedData = JSON.parse(localStorage.getItem('worldx_credits') || '{}');

      if (savedData.date !== today) {
        const freshData = { date: today, credits: DAILY_CREDITS };
        localStorage.setItem('worldx_credits', JSON.stringify(freshData));
        return DAILY_CREDITS;
      }
      return savedData.credits;
    }

    // دالة خصم النقاط عند توليد فيديو
    function deductCredits(amount = VIDEO_COST) {
      const today = new Date().toDateString();
      let savedData = JSON.parse(localStorage.getItem('worldx_credits') || `{"date":"${today}","credits":100}`);
      
      if (savedData.credits >= amount) {
        savedData.credits -= amount;
        localStorage.setItem('worldx_credits', JSON.stringify(savedData));
        updateCreditsUI();
        return true; // تمت العملية بنجاح
      } else {
        alert("⚠️ رصيدك اليومي غير كافي! انتظر حتى يتجدد الرصيد غداً.");
        return false; // الرصيد لا يكفي
      }
    }

    // دالة تحديث الواجهة بعرض النقاط المتبقية
    function updateCreditsUI() {
      const creditsElement = document.getElementById('user-credits-display');
      if (creditsElement) {
        creditsElement.innerText = getDailyCredits();
      }
    }

    // تشغيل التحديث فور تحميل الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      updateCreditsUI();
    });
  </script>

</body>
</html>
